<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Coffee Management</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        .header h1 {
            margin: 0;
            font-size: 2.5em;
        }
        .menu {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin: 30px 0;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 25px;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .btn-primary { background: #007bff; }
        .btn-primary:hover { background: #0056b3; transform: translateY(-2px); }
        .btn-success { background: #28a745; }
        .btn-success:hover { background: #1e7e34; transform: translateY(-2px); }
        .btn-warning { background: #ffc107; color: #212529; }
        .btn-warning:hover { background: #e0a800; transform: translateY(-2px); }
        .btn-danger {
            background: #dc3545;
            padding: 5px 15px;
            font-size: 0.9em;
        }
        .btn-edit {
            background: #28a745;
            color: white;
            padding: 5px 15px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 0.9em;
            display: inline-block;
            margin-right: 5px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        th {
            background-color: #f8f9fa;
            font-weight: 600;
            color: #495057;
        }
        tr:hover { background-color: #f8f9fa; }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-coffee"></i> Coffee Products Management</h1>
        <p>Spring Boot + Thymeleaf</p>
    </div>

    <div class="menu">
        <a href="/coffees/add" class="btn btn-primary">
            <i class="fas fa-plus-circle"></i> Add New Coffee
        </a>
        <a href="/" class="btn btn-warning">
            <i class="fas fa-home"></i> Back to Home
        </a>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Type</th>
            <th>Weight</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="coffee : ${coffees}">
            <td th:text="${coffee.id}"></td>
            <td>
                <strong th:text="${coffee.name}"></strong><br>
                <small style="color: #6c757d;" th:text="${coffee.packageType}"></small>
            </td>
            <td th:text="${coffee.type.description}"></td>
            <td th:text="${coffee.weight} + ' kg'"></td>
            <td><strong th:text="'$' + ${coffee.price}"></strong></td>
            <td th:text="${coffee.quantity} + ' units'"></td>
            <td>
                <a th:href="@{/coffees/edit/{id}(id=${coffee.id})}" class="btn-edit">
                    <i class="fas fa-edit"></i> Edit
                </a>
                <a th:href="@{/coffees/delete/{id}(id=${coffee.id})}"
                   class="btn btn-danger"
                   onclick="return confirm('Are you sure?')">
                    <i class="fas fa-trash"></i>
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
