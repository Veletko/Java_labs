<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add New Coffee</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .form-card {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .form-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .form-header h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .form-group {
            margin-bottom: 25px;
        }
        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }
        .form-row .form-group {
            flex: 1;
            margin-bottom: 0;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .btn-container {
            display: flex;
            gap: 15px;
            margin-top: 40px;
        }
        .btn {
            padding: 14px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            text-decoration: none;
            text-align: center;
        }
        .btn-submit {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(40, 167, 69, 0.3);
        }
        .btn-cancel {
            background: #6c757d;
            color: white;
        }
        @media (max-width: 768px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="container">
    <div class="form-card">
        <div class="form-header">
            <div class="coffee-icon">
                <i class="fas fa-coffee" style="font-size: 3em; color: #764ba2;"></i>
            </div>
            <h1>Add New Coffee Product</h1>
            <p>Spring Boot Form</p>
        </div>

        <form th:action="@{/coffees/add}" th:object="${coffee}" method="post">
            <div class="form-group">
                <label for="name">Coffee Name *</label>
                <input type="text" id="name" th:field="*{name}" required
                       placeholder="e.g., Arabica Premium">
            </div>

            <div class="form-group">
                <label for="type">Coffee Type *</label>
                <select id="type" th:field="*{type}" required>
                    <option value="">Select Type</option>
                    <option th:each="type : ${T(com.example.entity.Coffee.CoffeeType).values()}"
                            th:value="${type}"
                            th:text="${type.description}">
                    </option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="weight">Net Weight (kg) *</label>
                    <input type="number" id="weight" th:field="*{weight}" step="0.001" min="0.001" required>
                </div>
                <div class="form-group">
                    <label for="price">Price ($) *</label>
                    <input type="number" id="price" th:field="*{price}" step="0.01" min="0.01" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="packageWeight">Package Weight (kg)</label>
                    <input type="number" id="packageWeight" th:field="*{packageWeight}" step="0.001" min="0">
                </div>
                <div class="form-group">
                    <label for="packageType">Package Type</label>
                    <input type="text" id="packageType" th:field="*{packageType}"
                           placeholder="e.g., Vacuum Bag">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="quantity">Quantity in Stock *</label>
                    <input type="number" id="quantity" th:field="*{quantity}" min="0" required>
                </div>
                <div class="form-group">
                    <label for="volume">Volume (m³)</label>
                    <input type="number" id="volume" th:field="*{volume}" step="0.0001" min="0">
                </div>
            </div>

            <div class="btn-container">
                <button type="submit" class="btn btn-submit">
                    <i class="fas fa-plus-circle"></i> Add Coffee
                </button>
                <a href="/coffees" class="btn btn-cancel">
                    <i class="fas fa-times"></i> Cancel
                </a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
